[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "r2r-evaluation-report-generator"
version = "0.1.0"
description = "Generate auditable 26x38 R2R measurement and prediction evaluation workbooks."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Yunhyok"}]
dependencies = [
    "PySide6==6.11.1",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-qt==4.4.0",
    "ruff==0.11.13",
    "pyinstaller==6.21.0",
]

[project.scripts]
r2r-evaluation-report = "r2r_evaluation_report.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
