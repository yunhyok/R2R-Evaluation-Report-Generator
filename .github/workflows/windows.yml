name: Windows validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python scripts/check_source_only.py
      - run: python -m r2r_evaluation_report --self-test
      - run: python -m PyInstaller --noconfirm --clean r2r_evaluation_report.spec
      - run: .\dist\R2REvaluationReportGenerator.exe --self-test
      - run: .\dist\R2REvaluationReportGenerator.exe --gui-smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
